
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MOVILIFT VOLLEY">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0b1424">

  <title>MOVILIFT VOLLEY</title>

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="apple-touch-icon-180.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b1424;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .cornice {
      position: fixed;
      inset: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #0b1424;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0b1424;
    }

    /* SCHERMATA DI CARICAMENTO */

    .caricamento {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b1424;
      color: #ffffff;
      transition: opacity 0.35s ease;
    }

    .caricamento.nascosto {
      opacity: 0;
      pointer-events: none;
    }

    /* PANNELLO CENTRALE */

    .pannello-caricamento {
      width: 100%;
      max-width: 390px;
      padding: 24px 20px;
      background: #14263b;
      border: 1px solid #294761;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.16);
    }

    /* INTESTAZIONE */

    .intestazione {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
    }

    .logo {
      display: block;
      width: 60px;
      height: 60px;
      flex: 0 0 60px;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: none;
      box-shadow: none;
    }

    .testo-intestazione {
      flex: 1;
      min-width: 0;
    }

    .titolo {
      margin: 0 0 7px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.35px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .sottotitolo {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 5px;
      background: rgba(8, 117, 181, 0.13);
      border: 1px solid rgba(140, 204, 240, 0.16);
      color: #8CCCF0;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1.1px;
    }

    /* SEZIONE CARICAMENTO */

    .sezione-caricamento {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      margin-top: 27px;
      padding-top: 21px;
      border-top: 1px solid rgba(140, 204, 240, 0.15);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(140, 204, 240, 0.18);
      border-top-color: #8CCCF0;
      border-radius: 50%;
      animation: gira 0.8s linear infinite;
    }

    .testo-caricamento {
      color: #aab8ca;
      font-size: 12px;
      letter-spacing: 0.3px;
      text-align: center;
    }

    @keyframes gira {
      to {
        transform: rotate(360deg);
      }
    }

    /* SMARTPHONE PICCOLI */

    @media (max-width: 380px) {
      .pannello-caricamento {
        padding: 20px 16px;
      }

      .intestazione {
        gap: 10px;
      }

      .logo {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
      }

      .titolo {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="cornice">

    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbx3Rcs-K2A92WeKP8VL1Cux6OcUtwnSiQXrr2TNk2ho1XFEjcs7vaebjvlSjo1RTEOLOA/exec"
      title="MOVILIFT SANTA MARIA ROSA NOVA VOLLEY"
      allow="fullscreen"
    ></iframe>

  </div>

  <div class="caricamento" id="caricamento">

    <div class="pannello-caricamento">

      <div class="intestazione">

        <img
          class="logo"
          src="apple-touch-icon-180.png"
          alt="Logo MOVILIFT"
        >

        <div class="testo-intestazione">

          <div class="titolo">
            MOVILIFT SANTA MARIA ROSA NOVA VOLLEY
          </div>

          <div class="sottotitolo">
            SERIE D MASCHILE
          </div>

        </div>

      </div>

      <div class="sezione-caricamento">

        <div class="spinner"></div>

      </div>

    </div>

  </div>

  <script>
    const app = document.getElementById("app");
    const caricamento = document.getElementById("caricamento");

    app.addEventListener("load", function() {
      caricamento.classList.add("nascosto");

      setTimeout(function() {
        caricamento.style.display = "none";
      }, 400);
    });
  </script>

</body>
</html>
