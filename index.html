
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MOVILIFT VOLLEY">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0b1424">

  <title>MOVILIFT VOLLEY</title>

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png?v=2">
  <link rel="icon" type="image/png" href="apple-touch-icon-180.png?v=2">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b1424;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .cornice {
      position: fixed;
      inset: 0;
      background: #0b1424;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0b1424;
    }

    .caricamento {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b1424;
      color: #ffffff;
      transition: opacity 0.35s ease;
    }

    .caricamento.nascosto {
      opacity: 0;
      pointer-events: none;
    }

    .contenuto-caricamento {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 320px;
    }

    .logo {
      display: block;
      width: 100px;
      height: 100px;
      object-fit: cover;
      border: none;
      border-radius: 50%;
      box-shadow: none;
    }

    .titolo {
      margin-top: 22px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.4px;
      line-height: 1.4;
      color: #ffffff;
    }

    .spinner {
      width: 25px;
      height: 25px;
      margin-top: 28px;
      border: 2px solid rgba(140, 204, 240, 0.2);
      border-top-color: #8CCCF0;
      border-radius: 50%;
      animation: gira 0.8s linear infinite;
    }

    @keyframes gira {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="cornice">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbx3Rcs-K2A92WeKP8VL1Cux6OcUtwnSiQXrr2TNk2ho1XFEjcs7vaebjvlSjo1RTEOLOA/exec"
      title="MOVILIFT SANTA MARIA ROSA NOVA VOLLEY"
      allow="fullscreen"
    ></iframe>
  </div>

  <div class="caricamento" id="caricamento">
    <div class="contenuto-caricamento">

      <img
        class="logo"
        src="apple-touch-icon-180.png?v=2"
        alt="Logo MOVILIFT"
      >

      <div class="titolo">
        MOVILIFT SANTA MARIA ROSA NOVA VOLLEY
      </div>

      <div class="spinner"></div>

    </div>
  </div>

  <script>
    const app = document.getElementById("app");
    const caricamento = document.getElementById("caricamento");

    app.addEventListener("load", function() {
      caricamento.classList.add("nascosto");

      setTimeout(function() {
        caricamento.style.display = "none";
      }, 400);
    });
  </script>

</body>
</html>
