<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MOVILIFT VOLLEY">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0b1424">

  <title>MOVILIFT VOLLEY</title>

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="apple-touch-icon-180.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b1424;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .cornice {
      position: fixed;
      inset: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #0b1424;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0b1424;
    }

    .caricamento {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #0b1424;
      color: white;
      transition: opacity 0.35s ease;
    }

    .caricamento.nascosto {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 30px rgba(255,255,255,0.08);
    }

    .titolo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1px;
      text-align: center;
    }

    .sottotitolo {
      font-size: 14px;
      color: #aab9ce;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.18);
      border-top-color: white;
      border-radius: 50%;
      animation: gira 0.8s linear infinite;
    }

    @keyframes gira {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="cornice">

    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbx3Rcs-K2A92WeKP8VL1Cux6OcUtwnSiQXrr2TNk2ho1XFEjcs7vaebjvlSjo1RTEOLOA/exec"
      title="MOVILIFT SANTA MARIA ROSA NOVA VOLLEY"
      allow="fullscreen"
    ></iframe>

  </div>

  <div class="caricamento" id="caricamento">

    <img
      class="logo"
      src="apple-touch-icon-180.png"
      alt="Logo MOVILIFT"
    >

    <div class="titolo">
      MOVILIFT SANTA MARIA ROSA NOVA VOLLEY
    </div>

    <div class="spinner"></div>

  </div>

  <script>
    const app = document.getElementById("app");
    const caricamento = document.getElementById("caricamento");

    app.addEventListener("load", function() {
      caricamento.classList.add("nascosto");

      setTimeout(function() {
        caricamento.style.display = "none";
      }, 400);
    });
  </script>

</body>
</html>
